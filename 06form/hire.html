<!-- start the page main -->
    <main>
        <h1>Hire Me</h1>
      
        <form method="get" action="thanks.html" class="myform">

            <fieldset>
                <legend>Your Info</legend>
            <label>First Name: <input type="text" name="firstname" required> </label>
            <label>Last Name: <input type="text" name="firstname" required> </label>
            <label>E-mail: <input type="text" name="firstname" required> </label>
            <label>Cell Number: <input type="tel" name="Phone Number" required placeholder="789-123-4567"> </label>
            </fieldset>

            <fieldset> 
                <legend>Type of Project</legend>
                <label><input type="checkbox" name="Photo" value="photo">Photography</label>
                <label><input type="checkbox" name="design" value="design">Design</label>
                <label><input type="checkbox" name="3d" value="3d">3d (blender)</label>
                <label><input type="checkbox" name="All 3" value="all 3">All 3 Options</label>
                
            </fieldset>

            <fieldset>
                <legend>Delivery Time</legend>
                <label><input type="radio" value="fast" name="method" >1-3 days</label>
                 <label><input type="radio" value="medium" name="method" >3-5 days</label>
                  <label><input type="radio" value="slow" name="method" >5-10 days (best Results)</label>
                  <br>
                  <label>Preferred Delivery Format
                    <select class="dark" name="time">
                        <option value="none">Please Select</option>
                        <option value="morning">Standard Images</option>
                        <option value="noon">Standard Images Plus Working File</option>
                        <option value="afternoon">The Whole Project File</option>
                    </select>
                </label>
            </fieldset>

            

            <label>About The Project (please be really thorough):
                <textarea name="Project Description"></textarea>
            </label>

            <input type="submit" value="Send Information">

        </form>







    </main>
